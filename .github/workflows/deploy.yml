name: Deploy to Synology NAS

on:
  push:
    branches:
      - main

env:
  IMAGE: ghcr.io/erisme/flip7scores-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Bootstrap + déploiement NAS
        uses: appleboy/ssh-action@v1
        env:
          # Compat migration : retombe sur l'ancien secret NAS_DEPLOY_PATH si la Variable n'existe pas encore
          NAS_DIR: ${{ vars.NAS_DIR || secrets.NAS_DEPLOY_PATH }}
          IMAGE: ${{ env.IMAGE }}
          ALLOWED_ORIGIN: ${{ secrets.ALLOWED_ORIGIN }}
        with:
          host: ${{ secrets.NAS_HOST }}
          username: ${{ secrets.NAS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.NAS_PORT }}
          envs: NAS_DIR,IMAGE,ALLOWED_ORIGIN
          script: |
            set -e
            if [ -z "$NAS_DIR" ]; then
              echo "❌ NAS_DIR non défini (Settings → Variables → Actions)."
              exit 1
            fi
            mkdir -p "$NAS_DIR"

            # Écrire docker-compose.yml via heredoc (pas de scp-action)
            cat > "$NAS_DIR/docker-compose.yml" << 'COMPOSE'
            services:
              app:
                image: ghcr.io/erisme/flip7scores-app:latest
                container_name: flip7scores-app
                ports:
                  - "8082:80"
                environment:
                  PORT: 3002
                  ALLOWED_ORIGIN: "${ALLOWED_ORIGIN:-http://localhost:5173}"
                volumes:
                  - flip7-data:/app/api/data
                restart: unless-stopped

            volumes:
              flip7-data:
            COMPOSE

            # Ne jamais écraser un .env existant avec une valeur vide (CORS casserait)
            if [ -n "$ALLOWED_ORIGIN" ]; then
              echo "ALLOWED_ORIGIN=${ALLOWED_ORIGIN}" > "$NAS_DIR/.env"
            elif [ ! -f "$NAS_DIR/.env" ]; then
              echo "ALLOWED_ORIGIN=" > "$NAS_DIR/.env"
              echo "⚠️  Secret ALLOWED_ORIGIN absent : .env créé vide, CORS retombera sur le défaut."
            else
              echo "ℹ️  Secret ALLOWED_ORIGIN absent : .env existant du NAS conservé."
            fi

            # Synology : docker n'est pas dans le PATH SSH standard
            DOCKER=$(command -v docker 2>/dev/null \
              || echo /var/packages/ContainerManager/target/usr/bin/docker)

            # Pull sans credentials cachés (package GHCR public)
            DOCKER_CONFIG=$(mktemp -d)
            export DOCKER_CONFIG
            "$DOCKER" pull "$IMAGE:latest"
            unset DOCKER_CONFIG

            cd "$NAS_DIR"
            if "$DOCKER" compose version >/dev/null 2>&1; then
              "$DOCKER" compose up -d --remove-orphans
            else
              docker-compose up -d --remove-orphans
            fi
